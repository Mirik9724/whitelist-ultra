# Globale Platzhalter
# @nick - Spielername (kann nicht überall verwendet werden)
#
# Hier können Sie eigene Platzhalter hinzufügen
placeholders:
  "@fu": "Fu!!!"
  "@custom": "BenutzerdefinierterWert"
  "@test": "Test!"

check_updates: "True"

error:
  file_: "Testnachricht"
  file_does_not-exist: "Datei existiert nicht."
  underknewcom: "Unbekannter Befehl: @undsubcom"
  subc: "Bitte geben Sie den Unterbefehl an."

commands:
  subc: "Bitte geben Sie einen Unterbefehl ein"
  usage: "Verwendung: " # + Verwendung der Befehl

  change:
    old_not_found: "Der alte Spitzname wurde in der Liste nicht gefunden."
    duplicate: "Der neue Spitzname ist bereits in der Liste vorhanden."
    success: "Spitzname erfolgreich geändert."

  remove:
    m1: "Spieler @nick wurde von der Whitelist entfernt."
    m2: "Spieler @nick ist nicht auf der Whitelist."
    kick: "Sie wurden von der Whitelist entfernt."

  add:
    m1: "Spieler @nick wurde erfolgreich zur Whitelist hinzugefügt."
    m2: "Spieler @nick ist bereits auf der Whitelist."

  check:
    found: "Spieler @nick ist auf der Whitelist."
    not_found: "Spieler @nick ist nicht auf der Whitelist."

  list: "Whitelist: " # + Liste der Spieler in WLU
  player: "Spieler @nick"

reload: "Das Plugin wurde erfolgreich neu geladen!"
kick: "Sie stehen nicht auf der Whitelist."

version:
  v_no_connect: "Es konnte keine neue Version des Plugins abgerufen werden."
  v_no_found: "Kein Update gefunden."
  v_found: "Update gefunden. Neueste Version: @new_v"

# BStats-Metriken verwenden
# (Bitte nicht deaktivieren, damit ich die Nutzung des Plugins verfolgen kann — anonym)
use-metric: True

