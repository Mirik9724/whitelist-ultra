# 全局占位符
# @nick - 玩家的昵称(you cann`t use it everywhere)
#
# 您可以在此添加自定义占位符
placeholders:
  "@fu": "Fu!!!"
  "@custom": "CustomValue"
  "@test": "Test!"

error:
  file_: "测试信息"
  file_does_not-exist: "文件不存在。"
  underknewcom: "未知命令： @undsubcom"
  subc: "请指定子命令。"
commands:
  usage: "用法： " # +usage for command
  change:
    old_not_found: "列表中未找到旧昵称。"
    duplicate: "新昵称已存在于列表中。"
    success: "昵称修改成功。"

  remove:
    m1: "玩家 @nick 已从白名单中移除。"
    m2: "玩家 @nick 不在白名单中。"
    kick: "您已被移出白名单"

  add:
    m1: "玩家 @nick 已成功添加到白名单。"
    m2: "玩家 @nick 已在白名单中。"

  check:
    found: "玩家 @nick 在白名单中。"
    not_found: " 玩家 @nick 不在白名单中。"

  list: "白名单： " # + list of player in WLU
  player: "玩家 @nick"
reload: "插件已成功重新加载！"
kick: "您不在白名单中。"

version:
  v_no_connect: "无法获取新插件版本。"
  v_no_found: "未找到更新。"
  v_found: "发现更新，这是最新版本： @new_v"

# Use BStats metrics (Please do not disable it so that I have an idea about the plugin users (anonymous info))
use-metric: True

