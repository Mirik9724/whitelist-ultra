# Espaces réservés globaux
# @nick - surnom du joueur(you cann`t use it everywhere)
#
# Vous pouvez ajouter vos propres espaces réservés ici
placeholders:
  "@fu": "Fu!!!"
  "@custom": "CustomValue"
  "@test": "Test!"

error:
  file_: "Message de test"
  file_does_not-exist: "Le fichier n'existe pas."
  underknewcom: "Commande inconnue : @undsubcom"
  subc: "Veuillez spécifier la sous-commande."
commands:
  usage: "Utilisation : " # +usage for command
  change:
    old_not_found: "L'ancien pseudo n'a pas été trouvé dans la liste."
    duplicate: "Le nouveau pseudo existe déjà dans la liste."
    success: "Pseudo modifié avec succès."

  remove:
    m1: "Le joueur @nick a été retiré de la liste blanche."
    m2: "Le joueur @nick n'est pas dans la liste blanche."
    kick: "Vous avez été retiré de la liste blanche"

  add:
    m1: "Le joueur @nick a été ajouté à la liste blanche avec succès."
    m2: "Le joueur @nick est déjà dans la liste blanche."

  check:
    found: "Le joueur @nick est dans la liste blanche."
    not_found: " Le joueur @nick n'est pas dans la liste blanche."

  list: "Liste blanche : " # + list of player in WLU
  player: "Joueur @nick"
reload: "Le plugin a été rechargé avec succès !"
kick: "Vous n'êtes pas sur la liste blanche."

version:
  v_no_connect: "Échec de récupération de la nouvelle version du plugin."
  v_no_found: "Mise à jour non trouvée."
  v_found: "Mise à jour trouvée, voici la dernière version : @new_v"

# Use BStats metrics (Please do not disable it so that I have an idea about the plugin users (anonymous info))
use-metric: True

